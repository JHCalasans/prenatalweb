<div class="shell">
  <aside class="barra">
    <p class="marca">Pré-Natal</p>
    <nav>
      <a routerLink="/inicio" routerLinkActive="ativo">
        <i class="pi pi-home" aria-hidden="true"></i>
        <span>Início</span>
      </a>
      <a routerLink="/agenda" routerLinkActive="ativo">
        <i class="pi pi-calendar" aria-hidden="true"></i>
        <span>Agenda</span>
      </a>
      <a routerLink="/relatorios" routerLinkActive="ativo">
        <i class="pi pi-chart-bar" aria-hidden="true"></i>
        <span>Relatórios</span>
      </a>
      @if (papel() === 'secretaria') {
        <a routerLink="/pacientes" routerLinkActive="ativo">
          <i class="pi pi-users" aria-hidden="true"></i>
          <span>Pacientes</span>
        </a>
        <a routerLink="/convites" routerLinkActive="ativo">
          <i class="pi pi-send" aria-hidden="true"></i>
          <span>Convites</span>
        </a>
        <a routerLink="/equipe" routerLinkActive="ativo">
          <i class="pi pi-id-card" aria-hidden="true"></i>
          <span>Equipe</span>
        </a>
      }
      @if (papel() === 'medica') {
        <a routerLink="/mesa" routerLinkActive="ativo">
          <i class="pi pi-users" aria-hidden="true"></i>
          <span>Minhas pacientes</span>
        </a>
        <a routerLink="/protocolo" routerLinkActive="ativo">
          <i class="pi pi-list-check" aria-hidden="true"></i>
          <span>Protocolo</span>
        </a>
        <a routerLink="/auditoria" routerLinkActive="ativo">
          <i class="pi pi-history" aria-hidden="true"></i>
          <span>Auditoria</span>
        </a>
      }
    </nav>
  </aside>

  <div class="area">
    <header class="topo">
      <div class="usuario">
        <strong>{{ perfil()?.nome }}</strong>
        <small>{{ papelRotulo() }}</small>
      </div>
      <p-button label="Sair" icon="pi pi-sign-out" severity="secondary" (onClick)="sair()" />
    </header>

    <main class="conteudo">
      <router-outlet />
    </main>
  </div>
</div>
