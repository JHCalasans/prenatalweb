<div class="shell">
  <aside class="barra">
    <p class="marca">Pré-Natal</p>
    <nav>
      @for (item of itens(); track item.rota) {
        <a [routerLink]="item.rota" routerLinkActive="ativo">
          <i class="pi {{ item.icone }}" aria-hidden="true"></i>
          <span>{{ item.rotulo }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="area">
    <header class="topo">
      <div class="usuario">
        <strong>{{ perfil()?.nome }}</strong>
        <small>{{ papelRotulo() }}</small>
      </div>
      <p-button label="Sair" icon="pi pi-sign-out" severity="secondary" (onClick)="sair()" />
    </header>

    <main class="conteudo">
      <router-outlet />
    </main>
  </div>
</div>
